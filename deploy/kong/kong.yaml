apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: jwt-auth
  namespace: cu-marketplace
plugin: jwt
config:
  uri_param_names:
    - token
  claims_to_verify:
    - exp
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: rate-limit
  namespace: cu-marketplace
plugin: rate-limiting
config:
  minute: 300
  policy: local
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: identity-headers
  namespace: cu-marketplace
plugin: post-function
config:
  access:
    - |
      local cjson = require "cjson.safe"

      local function b64url_decode(input)
        input = input:gsub('-', '+'):gsub('_', '/')
        local rem = #input % 4
        if rem > 0 then input = input .. string.rep('=', 4 - rem) end
        return ngx.decode_base64(input)
      end

      local function get_raw_token()
        local auth_header = kong.request.get_header("authorization")
        if auth_header then
          local _, _, token = string.find(auth_header, "Bearer%s+(.+)")
          if token then return token end
        end
        return kong.request.get_query_arg("token")
      end

      local token = get_raw_token()
      if token then
        local _, payload_b64 = token:match("([^.]+)%.([^.]+)%.?([^.]*)")
        local payload_json = payload_b64 and b64url_decode(payload_b64)
        local claims = payload_json and cjson.decode(payload_json)
        if claims then
          kong.service.request.set_header("X-User-Id", claims.userId)
          kong.service.request.set_header("X-User-Role", claims.role)
        end
      end

      local internal_key = os.getenv("INTERNAL_SERVICE_SECRET")
      if internal_key then
        kong.service.request.set_header("X-Internal-Key", internal_key)
      end
---
apiVersion: v1
kind: Secret
metadata:
  name: cu-marketplace-jwt-credential
  namespace: cu-marketplace
  labels:
    konghq.com/credential: jwt
stringData:
  key: "${JWT_ISSUER}"
  algorithm: HS256
  secret: "${JWT_SECRET}"
---
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: cu-marketplace-auth
  namespace: cu-marketplace
  annotations:
    kubernetes.io/ingress.class: kong
username: cu-marketplace-auth
credentials:
  - cu-marketplace-jwt-credential
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public-ingress
  namespace: cu-marketplace
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: rate-limit
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service: { name: profile-service, port: { number: 3006 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: protected-ingress
  namespace: cu-marketplace
  annotations:
    konghq.com/strip-path: "true"
    konghq.com/plugins: jwt-auth,identity-headers,rate-limit
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /api/v1/catalog
            pathType: Prefix
            backend:
              service: { name: catalog-service, port: { number: 3001 } }
          - path: /api/v1/orders
            pathType: Prefix
            backend:
              service: { name: order-service, port: { number: 3002 } }
          - path: /api/v1/chats
            pathType: Prefix
            backend:
              service: { name: chat-service, port: { number: 3003 } }
          - path: /api/v1/wishlists
            pathType: Prefix
            backend:
              service: { name: wishlist-service, port: { number: 3004 } }
          - path: /api/v1/matches
            pathType: Prefix
            backend:
              service: { name: wishlist-service, port: { number: 3004 } }
          - path: /api/v1/reviews
            pathType: Prefix
            backend:
              service: { name: review-service, port: { number: 3005 } }
          - path: /api/v1/profiles
            pathType: Prefix
            backend:
              service: { name: profile-service, port: { number: 3006 } }
          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service: { name: notification-service, port: { number: 3007 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storage-ingress
  namespace: cu-marketplace
  annotations:
    # false, and the path below is the literal bucket name, not a generic '/storage'
    # prefix: SigV4 signs the full request path, and Garage's path-style addressing
    # reads the first path segment as the bucket name. A '/storage' prefix that Kong
    # stripped would sign one path but deliver another (invalid signature); forwarding
    # it unstripped would make Garage look for a bucket literally named "storage". The
    # only path that is simultaneously correct for both signing and bucket routing is
    # the bucket's own name, passed through untouched.
    konghq.com/strip-path: "false"
    konghq.com/plugins: rate-limit
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          # Presigned PUT/GET requests from the browser straight to Garage's S3 API.
          # No jwt-auth here: the request's own SigV4 signature is the authentication,
          # and a JWT plugin would reject these requests before Garage ever sees them.
          - path: /cu-marketplace-images
            pathType: Prefix
            backend:
              service: { name: garage, port: { number: 3900 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog-photos-ingress
  namespace: cu-marketplace
  annotations:
    # false on purpose (every other catalog route uses true): PhotosController matches
    # the full /api/v1/catalog/photos/:key path rather than assuming it's pre-stripped,
    # so a bare ':key' route doesn't end up shadowing sibling routes at the service root.
    konghq.com/strip-path: "false"
    konghq.com/plugins: identity-headers,rate-limit
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          # More specific than protected-ingress's /api/v1/catalog, so Kong matches this
          # one first. identity-headers (but not jwt-auth) still runs, since catalog-service's
          # own InternalAuthGuard requires X-Internal-Key on every request regardless of
          # end-user identity — photos are viewed via plain <img src>, which can't attach
          # an Authorization header, so requiring a user JWT here isn't an option.
          - path: /api/v1/catalog/photos
            pathType: Prefix
            backend:
              service: { name: catalog-service, port: { number: 3001 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-socket-ingress
  namespace: cu-marketplace
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/plugins: jwt-auth,identity-headers,rate-limit
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service: { name: chat-service, port: { number: 3003 } }
