gateway:
  env:
    # identity-headers runs inside the Lua sandbox. Allow only its JSON decoder
    # and environment reader, and preserve the shared key in Nginx workers.
    untrusted_lua: sandbox
    untrusted_lua_sandbox_requires: cjson.safe
    untrusted_lua_sandbox_environment: os.getenv
    nginx_main_env: INTERNAL_SERVICE_SECRET
  proxy:
    type: NodePort
    http:
      nodePort: 30080
  customEnv:
    INTERNAL_SERVICE_SECRET:
      valueFrom:
        secretKeyRef:
          name: app-secrets
          key: INTERNAL_SERVICE_SECRET
