apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: cu-marketplace
spec:
  replicas: 1
  selector:
    matchLabels: { app: chat-service }
  template:
    metadata:
      labels: { app: chat-service }
    spec:
      containers:
        - name: chat-service
          image: cu-marketplace/chat-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: cu-marketplace
spec:
  selector: { app: chat-service }
  ports:
    - { name: http, port: 3003, targetPort: 3003 }
