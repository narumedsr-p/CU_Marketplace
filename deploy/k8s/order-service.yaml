apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cu-marketplace
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: cu-marketplace/order-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: cu-marketplace
spec:
  selector: { app: order-service }
  ports:
    - { name: http, port: 3002, targetPort: 3002 }
    - { name: grpc, port: 4002, targetPort: 4002 }
