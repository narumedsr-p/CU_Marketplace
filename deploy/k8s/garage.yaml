apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: cu-marketplace
data:
  garage.toml: |
    metadata_dir = "/data/meta"
    data_dir = "/data/data"
    db_engine = "sqlite"
    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.localhost"

    [admin]
    api_bind_addr = "[::]:3903"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: cu-marketplace
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels: { app: garage }
  template:
    metadata:
      labels: { app: garage }
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v1.0.1
          command: ["/garage", "server"]
          env:
            - { name: GARAGE_RPC_SECRET, valueFrom: { secretKeyRef: { name: app-secrets, key: GARAGE_RPC_SECRET } } }
            - { name: GARAGE_ADMIN_TOKEN, valueFrom: { secretKeyRef: { name: app-secrets, key: GARAGE_ADMIN_TOKEN } } }
          ports:
            - { containerPort: 3900, name: s3-api }
            - { containerPort: 3901, name: rpc }
            - { containerPort: 3903, name: admin }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "384Mi" }
          volumeMounts:
            - { name: config, mountPath: /etc/garage.toml, subPath: garage.toml }
            - { name: data, mountPath: /data }
      volumes:
        - name: config
          configMap: { name: garage-config }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: cu-marketplace
spec:
  clusterIP: None
  selector: { app: garage }
  ports:
    - { port: 3900, targetPort: 3900, name: s3-api }
    - { port: 3901, targetPort: 3901, name: rpc }
    - { port: 3903, targetPort: 3903, name: admin }
