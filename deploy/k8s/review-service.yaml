apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: cu-marketplace
spec:
  replicas: 1
  selector:
    matchLabels: { app: review-service }
  template:
    metadata:
      labels: { app: review-service }
    spec:
      containers:
        - name: review-service
          image: cu-marketplace/review-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: cu-marketplace
spec:
  selector: { app: review-service }
  ports:
    - { name: http, port: 3005, targetPort: 3005 }
