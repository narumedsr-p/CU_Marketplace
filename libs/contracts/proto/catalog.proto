syntax = "proto3";

package catalog;

service CatalogService {
  rpc ReserveItem (ItemRequest) returns (ItemResponse);
  rpc UnreserveItem (ItemRequest) returns (ItemResponse);
  rpc MarkItemAsSold (ItemRequest) returns (ItemResponse);
  rpc SuspendItem (ItemRequest) returns (ItemResponse);
  rpc SuspendAllUserItems (SuspendAllRequest) returns (SuspendAllResponse);
}

message ItemRequest {
  string itemId = 1;
}

message ItemResponse {
  string itemId = 1;
  string status = 2;
}

message SuspendAllRequest {
  string sellerId = 1;
}

message SuspendAllResponse {
  int32 suspendedCount = 1;
}
