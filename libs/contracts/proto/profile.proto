syntax = "proto3";

package profile;

service ProfileService {
  rpc OAuthLogin (OAuthLoginRequest) returns (OAuthLoginResponse);
}

message OAuthLoginRequest {
  string email = 1;
  string displayName = 2;
  string avatarUrl = 3;
}

message OAuthLoginResponse {
  string userId = 1;
  string email = 2;
  string accountStatus = 3;
  string role = 4;
}
